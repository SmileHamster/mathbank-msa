server:
  port: 8082

spring:
  application:
    name: problem-service
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/mathbank_problem}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.mathbank.problem.domain
  configuration:
    map-underscore-to-camel-case: true
