server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
              predicates:
                - Path=/api/auth/**
            - id: problem-service
              uri: ${PROBLEM_SERVICE_URI:http://problem-service:8082}
              predicates:
                - Path=/api/problems/**
            - id: examsheet-service
              uri: ${EXAMSHEET_SERVICE_URI:http://examsheet-service:8083}
              predicates:
                - Path=/api/examsheets/**
            - id: attempt-service
              uri: ${ATTEMPT_SERVICE_URI:http://attempt-service:8084}
              predicates:
                - Path=/api/attempts/**

jwt:
  secret: ${JWT_SECRET:mathbank-secret-key-must-be-32-chars-minimum}
