server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        - id: problem-service
          uri: http://problem-service:8082
          predicates:
            - Path=/api/problems/**
        - id: examsheet-service
          uri: http://examsheet-service:8083
          predicates:
            - Path=/api/examsheets/**
        - id: attempt-service
          uri: http://attempt-service:8084
          predicates:
            - Path=/api/attempts/**
