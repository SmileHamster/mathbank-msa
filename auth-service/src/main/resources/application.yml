server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/mathbank_auth}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.mathbank.auth.domain
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:mathbank-secret-key-must-be-32-chars-minimum}
  expiration: 86400000

app:
  admin:
    init-password: ${ADMIN_INIT_PASSWORD:admin1234}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
