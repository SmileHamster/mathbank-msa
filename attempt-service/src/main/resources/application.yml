server:
  port: 8084
  tomcat:
    threads:
      max: 20
      min-spare: 2

spring:
  application:
    name: attempt-service
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/mathbank_attempt}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.mathbank.attempt.domain
  configuration:
    map-underscore-to-camel-case: true

problem:
  service:
    url: ${PROBLEM_SERVICE_URL:http://localhost:8082}

examsheet:
  service:
    url: ${EXAMSHEET_SERVICE_URL:http://localhost:8083}
