server:
  port: 8083

spring:
  application:
    name: examsheet-service
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/mathbank_exam}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.mathbank.examsheet.domain
  configuration:
    map-underscore-to-camel-case: true

problem:
  service:
    url: ${PROBLEM_SERVICE_URL:http://localhost:8082}
